seed: 45
dataset:
  name: CIFAR10
  processed_dir: data/processed/cifar10
  num_classes: 10
  image_shape:
  - 32
  - 32
  - 3
partition:
  method: dirichlet
  alpha: 0.5
  num_clients: 100
  seed: 45
  min_samples_per_client: 10
  val_fraction: 0.1
model:
  name: SmallCNN
  num_classes: 10
training:
  local_epochs: 1
  batch_size: 32
  optimizer: sgd
  learning_rate: 0.01
  momentum: 0.9
  weight_decay: 0.0001
fl:
  num_rounds: 100
  num_clients: 100
  clients_per_round: 10
  aggregation: fedavg
drift:
  enabled: true
  drift_type: class_swap
  drift_round: 50
  drift_fraction: 0.3
  severity: medium
selection:
  method: fedqual_cpx
  detector_name: cusum
  change_explore_weight: 1.0
  guaranteed_change_priority: false
normalization:
  method: robust_mad
evaluation:
  test_every: 5
