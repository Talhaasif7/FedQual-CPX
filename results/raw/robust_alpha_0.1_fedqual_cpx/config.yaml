seed: 42
dataset:
  name: CIFAR10
  processed_dir: data/processed/cifar10
  num_classes: 10
  image_shape:
  - 32
  - 32
  - 3
partition:
  method: dirichlet
  alpha: 0.1
  num_clients: 30
  seed: 42
  min_samples_per_client: 10
  val_fraction: 0.1
model:
  name: SmallCNN
  num_classes: 10
training:
  local_epochs: 1
  batch_size: 32
  optimizer: sgd
  learning_rate: 0.01
  momentum: 0.9
  weight_decay: 0.0001
fl:
  num_rounds: 30
  num_clients: 30
  clients_per_round: 5
  aggregation: fedavg
drift:
  enabled: true
  drift_type: class_swap
  drift_round: 15
  drift_fraction: 0.3
  severity: medium
selection:
  method: fedqual_cpx
  detector_name: cusum
  warmup_rounds: 5
  epsilon_min: 0.08
  epsilon_max: 0.35
  delta: 0.3
  h: 2.5
  cooldown: 2
  use_uncertainty: true
  use_adaptive_epsilon: true
  use_change_bonus: true
normalization:
  method: robust_mad
  z_max: 3.0
  epsilon: 1.0e-08
evaluation:
  test_every: 1
  save_checkpoint_every: 100
output:
  results_dir: results/raw
  save_checkpoints: false
