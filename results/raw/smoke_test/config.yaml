dataset:
  name: CIFAR10
  processed_dir: data/processed/cifar10
  num_classes: 10
  image_shape:
  - 32
  - 32
  - 3
model:
  name: SmallCNN
  num_classes: 10
training:
  local_epochs: 1
  batch_size: 32
  optimizer: sgd
  learning_rate: 0.01
  momentum: 0.9
  weight_decay: 0.0001
normalization:
  method: robust_mad
  z_max: 3.0
  epsilon: 1.0e-08
output:
  results_dir: results/raw
  save_checkpoints: false
partition:
  method: dirichlet
  alpha: 0.5
  num_clients: 20
  seed: 42
  min_samples_per_client: 10
  val_fraction: 0.1
fl:
  num_rounds: 10
  num_clients: 20
  clients_per_round: 5
  aggregation: fedavg
selection:
  method: random
evaluation:
  test_every: 1
  save_checkpoint_every: 100
seed: 42
