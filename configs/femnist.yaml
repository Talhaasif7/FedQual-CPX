# =============================================================================
# FedQual-CPX — FEMNIST Configuration
# =============================================================================
# Section 6.2 & 27.2: FEMNIST Natural Writer Partitioning benchmark

dataset:
  name: "FEMNIST"
  processed_dir: "data/processed/femnist"
  num_classes: 62
  image_shape: [28, 28, 1]

partition:
  method: "natural_writer_id"
  num_clients: 3500
  val_fraction: 0.1

model:
  name: "FEMNISTCNN"
  num_classes: 62

fl:
  num_rounds: 100
  num_clients: 100
  clients_per_round: 10
  aggregation: "fedavg"

training:
  local_epochs: 2
  batch_size: 32
  optimizer: "sgd"
  learning_rate: 0.01
  momentum: 0.9
  weight_decay: 0.0001

selection:
  method: "fedqual_cpx"
  detector_name: "cusum"
  warmup_rounds: 10
  epsilon_min: 0.05
  epsilon_max: 0.30
  delta: 0.3
  h: 2.5
  cooldown: 2
  use_uncertainty: true
  use_adaptive_epsilon: true
  use_change_bonus: true

normalization:
  method: "robust_mad"
  z_max: 3.0
  epsilon: 1e-8

drift:
  enabled: false
  type: "quality_shift"
  drift_round: 50
  drift_fraction: 0.3
  severity: "medium"

evaluation:
  test_every: 1
  save_checkpoint_every: 25

output:
  results_dir: "results/raw"
  save_checkpoints: true
